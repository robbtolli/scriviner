<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261E17" />
      <stop offset="50%" stop-color="#1A1512" />
      <stop offset="100%" stop-color="#100C09" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DC96" />
      <stop offset="35%" stop-color="#D8B244" />
      <stop offset="70%" stop-color="#C89B3C" />
      <stop offset="100%" stop-color="#9A701E" />
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D8B244" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#D8B244" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#D8B244" stop-opacity="0" />
    </radialGradient>

    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dx="0" dy="14" result="offsetblur" />
      <feFlood flood-color="#000000" flood-opacity="0.65" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full bleed background -->
  <rect width="1024" height="1024" fill="url(#bgGrad)" />

  <!-- Ambient Golden Center Glow -->
  <circle cx="512" cy="512" r="420" fill="url(#ambientGlow)" />

  <!-- Elegant Inner Border -->
  <rect x="72" y="72" width="880" height="880" rx="140" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-opacity="0.35" />
  <rect x="94" y="94" width="836" height="836" rx="120" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.2" />

  <!-- Corner Ornamental Accent Diamonds -->
  <polygon points="512,56 524,68 512,80 500,68" fill="url(#goldGrad)" opacity="0.6" />
  <polygon points="512,944 524,956 512,968 500,956" fill="url(#goldGrad)" opacity="0.6" />
  <polygon points="56,512 68,524 80,512 68,500" fill="url(#goldGrad)" opacity="0.6" />
  <polygon points="944,512 956,524 968,512 956,500" fill="url(#goldGrad)" opacity="0.6" />

  <!-- Material Icons auto_stories centered -->
  <g transform="translate(218, 218) scale(24.5)" filter="url(#bookShadow)">
    <path fill="url(#goldGrad)" d="M19 1l-5 5v11l5-4.5V1zM1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5V6c-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6zm22 13.5V6c-.6-.45-1.25-.75-2-1v13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5v2c1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5v-1.1z"/>
  </g>
</svg>
