name: Deploy Scrivener to Cloudflare Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Web Apps
        run: |
          mkdir -p site/public/app site/public/dice-app
          flutter build web --release --base-href /app/ --output site/public/app
          flutter build web --target lib/main_dice.dart --release --base-href /dice-app/ --output site/public/dice-app

      - name: Install Website Dependencies
        working-directory: site
        run: npm ci

      - name: Build Astro & Starlight Documentation Site
        working-directory: site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'scrivener'
          directory: 'site/dist'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
